<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquema 3-4-2</title>
<style>
body {margin:0; font-family:Arial,sans-serif; background:orange; color:black; display:flex; flex-direction:column; min-height:100vh;}
header {background:orange; text-align:center; padding:1rem; font-size:2rem; font-weight:bold;}
.field {flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-around; background:#006400; margin:2rem; border:5px solid white; border-radius:15px; padding:1rem;}
.line {display:flex; justify-content:center; gap:1rem;}
.player {width:60px; height:60px; background:orange; border:2px solid black; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem; cursor:pointer;}
#nameBox {background:white; padding:1rem; margin:1rem; border-radius:10px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
.name {background:#ff8c00; padding:0.5rem 1rem; border-radius:5px; cursor:grab; user-select:none;}
</style>
</head>
<body>
<header>Terrão - 3-4-2</header>
<div id="nameBox">
  <div class="name" draggable="true">João</div>
  <div class="name" draggable="true">Maria</div>
  <div class="name" draggable="true">Pedro</div>
  <div class="name" draggable="true">Ana</div>
  <div class="name" draggable="true">Carlos</div>
  <div class="name" draggable="true">Sofia</div>
  <div class="name" draggable="true">Rafael</div>
  <div class="name" draggable="true">Isabela</div>
  <div class="name" draggable="true">Miguel</div>
  <div class="name" draggable="true">Lara</div>
  <div class="name" draggable="true">Lucas</div>
  <div class="name" draggable="true">Beatriz</div>
  <div class="name" draggable="true">Gustavo</div>
  <div class="name" draggable="true">Clara</div>
  <div class="name" draggable="true">Bruno</div>
</div>
<div class="field">
  <div class="line"><div class="player" droppable="true"></div></div>
  <div class="line"><div class="player" droppable="true"></div><div class="player" droppable="true"></div><div class="player" droppable="true"></div></div>
  <div class="line"><div class="player" droppable="true"></div><div class="player" droppable="true"></div><div class="player" droppable="true"></div><div class="player" droppable="true"></div></div>
  <div class="line"><div class="player" droppable="true"></div><div class="player" droppable="true"></div></div>
</div>

<script>
let dragged;

// Arrastar nome
document.querySelectorAll('.name, .player').forEach(elem => {
  elem.addEventListener('dragstart', e => {
    dragged = e.target;
    setTimeout(() => e.target.style.visibility = 'hidden', 0);
  });
  elem.addEventListener('dragend', e => {
    e.target.style.visibility = 'visible';
  });
});

// Permitir soltar
const droppables = document.querySelectorAll('.player, #nameBox');
droppables.forEach(dropZone => {
  dropZone.addEventListener('dragover', e => e.preventDefault());
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    if(dropZone.classList.contains('player')) {
      if(dropZone.innerHTML.trim() === '') {
        dropZone.textContent = dragged.textContent;
        if(dragged.classList.contains('name')) dragged.remove();
        if(dragged.classList.contains('player')) dragged.textContent = '';
      }
    } else if(dropZone.id === 'nameBox') {
      if(dragged.classList.contains('player') && dragged.textContent.trim() !== '') {
        const newName = document.createElement('div');
        newName.className = 'name';
        newName.textContent = dragged.textContent;
        newName.draggable = true;
        newName.addEventListener('dragstart', e => {
          dragged = e.target;
          setTimeout(() => e.target.style.visibility = 'hidden', 0);
        });
        newName.addEventListener('dragend', e => {
          e.target.style.visibility = 'visible';
        });
        dropZone.appendChild(newName);
        dragged.textContent = '';
      }
    }
  });
});
</script>
</body>
</html>
