
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrão</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: orange;
      color: black;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: orange;
      text-align: center;
      padding: 1rem;
      font-size: 2rem;
      font-weight: bold;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    h2 {
      margin-bottom: 1rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .buttons button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: black;
      color: orange;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .buttons button:hover {
      background-color: #333;
    }
    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

<header>Terrão</header>

<main>
  <h2>Escolha o esquema tático</h2>
  <div class="buttons">
    <button onclick="escolher('442')">4-4-2</button>
    <button onclick="escolher('433')">4-3-3</button>
    <button onclick="escolher('352')">3-5-2</button>
    <button onclick="escolher('342')">3-4-2</button>
  </div>
</main>

<script>
function escolher(esquema) {
  window.location.href = esquema + ".html";
}
</script>

</body>
</html>
