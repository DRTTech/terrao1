
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquema 4-4-2</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: orange;
  color: black;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
header {
  background-color: orange;
  text-align: center;
  padding: 1rem;
  font-size: 2rem;
  font-weight: bold;
}
.field {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  background: #006400;
  margin: 2rem;
  border: 5px solid white;
  border-radius: 15px;
  padding: 1rem;
}
.line {
  display: flex;
  justify-content: center;
  gap: 1rem;
}
.player {
  width: 40px;
  height: 40px;
  background-color: orange;
  border: 2px solid black;
  border-radius: 50%;
}
</style>
</head>
<body>

<header>Terrão - 4-4-2</header>
<div class="field">
  <div class="line"><div class="player"></div></div> <!-- Goleiro -->
  <div class="line"><div class="player"></div><div class="player"></div><div class="player"></div><div class="player"></div></div> <!-- Defesa -->
  <div class="line"><div class="player"></div><div class="player"></div><div class="player"></div><div class="player"></div></div> <!-- Meio-campo -->
  <div class="line"><div class="player"></div><div class="player"></div></div> <!-- Ataque -->
</div>

</body>
</html>
